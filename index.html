<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3GIS KZ</title>

<link rel="stylesheet"
hrefist/leaflet.css

<style>
body{
margin:0;
}

#map{
height:100vh;
width:100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([43.3416,52.8619],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map);

L.marker([43.3416,52.8619])
.addTo(map)
.bindPopup("Жаңаөзен");

</script>

</body>
</html>
